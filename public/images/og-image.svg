<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B1020"/>
  
  <!-- Subtle Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="950" cy="200" r="350" fill="url(#glow)"/>

  <!-- Logo and Badge -->
  <g transform="translate(100, 90)">
    <!-- Logo Icon -->
    <rect width="56" height="56" rx="14" fill="#151D2F" stroke="#334155" stroke-width="2"/>
    <rect x="13" y="10" width="30" height="36" rx="4" stroke="#6366F1" stroke-width="2.5" fill="#0B1020"/>
    <rect x="18" y="16" width="9" height="6" rx="1" fill="#38BDF8"/>
    <rect x="29" y="16" width="9" height="6" rx="1" fill="#6366F1"/>
    <rect x="18" y="29" width="5" height="11" rx="1" fill="#38BDF8"/>
    <rect x="25" y="25" width="5" height="15" rx="1" fill="#6366F1"/>
    <rect x="32" y="23" width="5" height="17" rx="1" fill="#34D399"/>
    
    <!-- Title -->
    <text x="76" y="38" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="28" letter-spacing="-0.5">Phone Manager Pro</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 210)">
    <text x="0" y="36" fill="#6366F1" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600" letter-spacing="2">WINDOWS DESKTOP ERP</text>
    <text x="0" y="100" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="56" letter-spacing="-1.5">Run Your Phone Shop Smarter.</text>
    <text x="0" y="150" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-weight="400" font-size="22" width="750">
      Integrated desktop solution for POS sales, smartphone inventory, supplier purchases,
    </text>
    <text x="0" y="182" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-weight="400" font-size="22">
      operating expenses, and offline-first cash reconciliation.
    </text>
  </g>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(100, 460)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="220" height="70" rx="10" fill="#151D2F" stroke="#1E293B" stroke-width="1.5"/>
    <text x="20" y="30" fill="#38BDF8" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14">Architecture</text>
    <text x="20" y="52" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="16">Offline-First SQLite</text>

    <!-- Box 2 -->
    <rect x="240" y="0" width="220" height="70" rx="10" fill="#151D2F" stroke="#1E293B" stroke-width="1.5"/>
    <text x="260" y="30" fill="#6366F1" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14">Platform</text>
    <text x="260" y="52" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="16">Windows Desktop</text>

    <!-- Box 3 -->
    <rect x="480" y="0" width="220" height="70" rx="10" fill="#151D2F" stroke="#1E293B" stroke-width="1.5"/>
    <text x="500" y="30" fill="#34D399" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14">Retail Focus</text>
    <text x="500" y="52" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="16">POS &amp; Store Ledgers</text>
  </g>

  <!-- Illustration on Right Side -->
  <g transform="translate(770, 240)">
    <!-- Desktop Window Outline -->
    <rect width="360" height="260" rx="12" fill="#151D2F" stroke="#334155" stroke-width="2"/>
    <!-- Titlebar -->
    <rect width="360" height="32" rx="12" fill="#1E293B"/>
    <rect y="20" width="360" height="12" fill="#1E293B"/>
    <circle cx="20" cy="16" r="4" fill="#EF4444"/>
    <circle cx="34" cy="16" r="4" fill="#EAB308"/>
    <circle cx="48" cy="16" r="4" fill="#22C55E"/>
    <text x="70" y="20" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="11">Phone Manager Pro — Store POS</text>

    <!-- Content Mockup -->
    <rect x="16" y="48" width="100" height="50" rx="6" fill="#0B1020" stroke="#334155" stroke-width="1"/>
    <text x="26" y="66" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Today Sales</text>
    <text x="26" y="86" fill="#34D399" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">$3,420.00</text>

    <rect x="126" y="48" width="100" height="50" rx="6" fill="#0B1020" stroke="#334155" stroke-width="1"/>
    <text x="136" y="66" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">In Stock</text>
    <text x="136" y="86" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">148 Units</text>

    <rect x="236" y="48" width="108" height="50" rx="6" fill="#0B1020" stroke="#334155" stroke-width="1"/>
    <text x="246" y="66" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Cash Drawer</text>
    <text x="246" y="86" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">$1,150.00</text>

    <!-- Table Preview -->
    <rect x="16" y="112" width="328" height="132" rx="6" fill="#0B1020" stroke="#1E293B" stroke-width="1"/>
    <line x1="16" y1="136" x2="344" y2="136" stroke="#1E293B" stroke-width="1"/>
    <text x="26" y="128" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600">PRODUCT</text>
    <text x="180" y="128" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600">IMEI / SERIAL</text>
    <text x="290" y="128" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600">STATUS</text>

    <text x="26" y="156" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-size="11">Galaxy S24 Ultra 256GB</text>
    <text x="180" y="156" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">356789...102</text>
    <text x="290" y="156" fill="#34D399" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600">In Stock</text>

    <text x="26" y="184" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-size="11">iPhone 15 Pro 128GB</text>
    <text x="180" y="184" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">354210...884</text>
    <text x="290" y="184" fill="#34D399" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600">In Stock</text>

    <text x="26" y="212" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-size="11">Type-C Fast Charger 65W</text>
    <text x="180" y="212" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="10">SKU-CHG-65</text>
    <text x="290" y="212" fill="#38BDF8" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600">32 Qty</text>
  </g>
</svg>
